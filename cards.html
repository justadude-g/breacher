<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breacher // Card Designer</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto+Condensed:wght@300;400;700&family=Oswald:wght@300;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/cards.css">
</head>
<body>

<header>
  <div class="logo"><a href="index.html">BREACHER<span>//</span>CARDS</a></div>
  <div class="header-actions">
    <a class="btn ghost" href="index.html">&larr; Force Builder</a>
    <button class="btn" id="btn-new">New</button>
    <button class="btn primary" id="btn-save">Save</button>
    <button class="btn" id="btn-my-cards">My Cards</button>
    <button class="btn" id="btn-png">Export PNG</button>
    <button class="btn" id="btn-sheet">Print Sheet</button>
    <button class="btn ghost" id="theme-toggle" title="Switch theme">🌙</button>
  </div>
</header>

<div class="wrap">

  <!-- ── Editor column ───────────────────────────────── -->
  <div class="col">

    <section class="panel">
      <h2>Card Type</h2>
      <div class="tpl-picker">
        <button class="tpl-btn active" data-tpl="breacher">Breacher</button>
        <button class="tpl-btn" data-tpl="reference">Reference</button>
        <button class="tpl-btn" data-tpl="opfor">OPFOR</button>
        <button class="tpl-btn" data-tpl="hired-gun">Hired Gun</button>
        <button class="tpl-btn" data-tpl="weapon">Weapon</button>
        <button class="tpl-btn" data-tpl="gear">Gear</button>
      </div>
      <p id="tpl-blurb"></p>
      <p class="locked-note">Templates are locked to these categories — layout, colour and type are fixed so every printed card in a deck matches.</p>
    </section>

    <section class="panel">
      <h2>Card Details</h2>
      <div id="form"></div>
    </section>

  </div>

  <!-- ── Preview column ──────────────────────────────── -->
  <div class="col">
    <section class="panel">
      <h2>Live Preview</h2>
      <div class="preview-wrap">
        <span id="card-title-label">New card (unsaved)</span>
        <canvas id="preview" width="750" height="1050"></canvas>
        <div class="preview-opts">
          <label><input type="checkbox" id="opt-bleed"> 3&nbsp;mm bleed</label>
          <label><input type="checkbox" id="opt-marks" checked> Crop marks</label>
        </div>
        <p class="spec-note" id="spec-note"></p>
      </div>
    </section>
  </div>

</div>

<!-- ── Print sheet overlay ───────────────────────────── -->
<div class="overlay" id="sheet-view">
  <div class="overlay-inner">
    <div class="overlay-head">
      <h2>Print Sheet</h2>
      <div style="display:flex;gap:8px;">
        <button class="btn primary" id="btn-sheet-print">Print</button>
        <button class="btn" id="btn-sheet-close">Close</button>
      </div>
    </div>
    <div id="sheet-pages"></div>
  </div>
</div>

<!-- ── Library browser overlay ───────────────────────────── -->
<div class="overlay" id="browse-view">
  <div class="overlay-inner">
    <div class="overlay-head">
      <h2 id="browse-title">Library</h2>
      <button class="btn" id="btn-browse-close">Close</button>
    </div>
    <input type="text" id="browse-filter" class="browse-filter" placeholder="Filter…">
    <div id="browse-list"></div>
  </div>
</div>

<!-- ── Trash overlay ─────────────────────────────────── -->
<div class="overlay" id="trash-view">
  <div class="overlay-inner">
    <div class="overlay-head">
      <h2>Recently Deleted</h2>
      <button class="btn" id="btn-trash-close">Close</button>
    </div>
    <div id="trash-list"></div>
  </div>
</div>

<!-- ── My Cards overlay ───────────────────────────────── -->
<div class="overlay" id="my-cards-view">
  <div class="overlay-inner">
    <div class="overlay-head">
      <h2>My Cards</h2>
      <div style="display:flex;gap:8px;align-items:center;">
        <select id="lib-filter" style="background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:3px;padding:6px 8px;font-family:inherit;font-size:13px;">
          <option value="all">All types</option>
          <option value="breacher">Breacher</option>
          <option value="hired-gun">Hired Gun</option>
          <option value="opfor">OPFOR</option>
          <option value="reference">Reference</option>
          <option value="weapon">Weapon</option>
          <option value="gear">Gear</option>
        </select>
        <button class="btn" id="btn-my-cards-close">Close</button>
      </div>
    </div>
    <div id="library"></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:16px;padding-top:12px;border-top:1px solid var(--border);">
      <button class="mini-btn" id="btn-export">Export backup</button>
      <button class="mini-btn" id="btn-import">Import backup</button>
      <input type="file" id="import-input" accept="application/json" hidden>
      <button class="mini-btn" id="btn-trash">Recently deleted</button>
      <button class="mini-btn" id="btn-clear-sheet">Clear sheet queue (<span id="sheet-count">0</span>)</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- Load order matters: data, then drawing primitives,
     then the renderer, then storage, then the app. -->
<script src="js/game-data.js"></script>
<script src="js/card-icons.js"></script>
<script src="js/card-schema.js"></script>
<script src="js/card-library.js"></script>
<script src="js/card-render.js"></script>
<script src="js/card-store.js"></script>
<script src="js/cards-app.js"></script>
<script>
  /* Theme toggle, matching index.html's behaviour. */
  (function () {
    const saved = localStorage.getItem('breacher-theme');
    if (saved === 'dark') document.documentElement.classList.add('theme-dark');
    const btn = document.getElementById('theme-toggle');
    const sync = () => btn.textContent =
      document.documentElement.classList.contains('theme-dark') ? '☀️' : '🌙';
    sync();
    btn.addEventListener('click', () => {
      document.documentElement.classList.toggle('theme-dark');
      localStorage.setItem('breacher-theme',
        document.documentElement.classList.contains('theme-dark') ? 'dark' : 'light');
      sync();
    });
  })();
</script>

</body>
</html>
